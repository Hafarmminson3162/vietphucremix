<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="100%" height="100%">
  <defs>
    <!-- Straw weave gradient for the Nón Lá -->
    <linearGradient id="hatStrawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE6C" />
      <stop offset="45%" stop-color="#D49F43" />
      <stop offset="85%" stop-color="#BF852B" />
      <stop offset="100%" stop-color="#A56E1C" />
    </linearGradient>

    <!-- Subtle 3D shadow under the Nón Lá brim -->
    <filter id="hatShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&amp;display=swap');
    .vp-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      fill: #1C3F34;
      font-size: 88px;
    }
  </style>

  <!-- Group containing the whole typographic logo -->
  <g id="viet-phuc-logo">
    <!-- Letter "V" -->
    <text x="12" y="98" class="vp-text">V</text>

    <!-- Letter "i" with circular dot -->
    <text x="88" y="98" class="vp-text">i</text>

    <!-- Letter "e" (base letter without default diacritics) -->
    <text x="124" y="98" class="vp-text">e</text>

    <!-- Dấu nặng (dot below) for letter "ệ" -->
    <circle cx="150" cy="116" r="6" fill="#1C3F34" />

    <!-- NÓN LÁ (Vietnamese Conical Hat) on top of letter "ệ" -->
    <g transform="translate(150, 40)" filter="url(#hatShadow)">
      <!-- Hat cone body -->
      <path 
        d="M 0 -34 L 24 2 Q 0 7 -24 2 Z" 
        fill="url(#hatStrawGrad)" 
      />

      <!-- Concentric bamboo weave rings -->
      <path d="M -6 -23 Q 0 -21 6 -23" fill="none" stroke="#8C5317" stroke-width="0.9" opacity="0.8" />
      <path d="M -12 -14 Q 0 -11 12 -14" fill="none" stroke="#8C5317" stroke-width="0.95" opacity="0.85" />
      <path d="M -18 -5 Q 0 -1 18 -5" fill="none" stroke="#8C5317" stroke-width="1.0" opacity="0.9" />

      <!-- Radial bamboo ribs (tăm nón) radiating from apex (0, -34) -->
      <line x1="0" y1="-34" x2="-18" y2="2" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-34" x2="-10" y2="4" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-34" x2="-3" y2="5" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-34" x2="3" y2="5" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-34" x2="10" y2="4" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-34" x2="18" y2="2" stroke="#8C5317" stroke-width="0.8" opacity="0.6" />

      <!-- Crimson Red Rim Band (Vành nón lá đỏ thắm) -->
      <path 
        d="M -24.5 2 Q 0 7.5 24.5 2" 
        fill="none" 
        stroke="#9E2A2B" 
        stroke-width="3.6" 
        stroke-linecap="round" 
      />
    </g>

    <!-- Letter "t" -->
    <text x="178" y="98" class="vp-text">t</text>

    <!-- Letter "p" -->
    <text x="256" y="98" class="vp-text">p</text>

    <!-- Letter "h" -->
    <text x="322" y="98" class="vp-text">h</text>

    <!-- Letter "u" (base letter) -->
    <text x="388" y="98" class="vp-text">u</text>

    <!-- Dấu nặng (dot below) for letter "ụ" -->
    <circle cx="417" cy="116" r="6" fill="#1C3F34" />

    <!-- Letter "c" -->
    <text x="452" y="98" class="vp-text">c</text>
  </g>
</svg>
